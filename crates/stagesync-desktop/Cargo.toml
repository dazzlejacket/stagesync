[package]
name = "stagesync-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native desktop application for StageSync (Windows, macOS and Linux)."

[[bin]]
name = "stagesync-desktop"
path = "src/main.rs"

[dependencies]
stagesync-core.workspace = true
anyhow.workspace = true
eframe = "0.37"
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
# Only the audio *output* is taken from rodio; the decoding is done by
# `stagesync-core`, which already reads every format the pipeline supports. The
# default features would pull a second, older copy of symphonia in for nothing.
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"
