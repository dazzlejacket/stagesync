# Continuous integration for StageSync.
#
# Every job runs on a *native* runner for the platform it builds. There is no
# cross-compilation anywhere in this repository, so a green macOS job is a
# statement about macOS and a green Linux job is a statement about Linux - and
# a failure on one platform says nothing about the others.
#
# The four gates are the four the project contract requires (see AGENTS.md,
# "Build, test and lint"):
#
#   cargo fmt --all -- --check               formatting
#   cargo clippy --workspace --all-targets   lints; warnings are errors
#   cargo test --workspace                    the test suite
#   cargo build --release --workspace         the release binaries
#
# `fail-fast: false` keeps a Linux-only failure from hiding the state of the
# macOS and Windows jobs. It does not make any step optional.
#
# Pinned inputs, so that a green run is a statement about a known set of
# tools and not about whatever happened to be current that week:
#
#   * the actions are pinned to exact release tags, not to a floating major
#     version;
#   * the runner images are pinned to explicit labels;
#   * the Rust toolchain is pinned to the version in
#     `packaging/rust-toolchain.toml`, the same one the packaging scripts
#     insist on. Bumping it is a deliberate change, made in one place.
#
# Runner label note: `macos-15-intel` is the Intel (x86_64) macOS runner, and
# `macos-15` is the Apple Silicon one; the two are the same macOS release on
# different processors. GitHub retires runner images from time to time; if a
# label disappears from the runner list, replace it with the current
# equivalent (`macos-26-intel` and `macos-26` respectively) and say so in the
# commit that does it.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The Rust toolchain every job builds with. It has to be the version in
  # packaging/rust-toolchain.toml: the packaging scripts refuse to build a
  # release with a different compiler.
  STAGESYNC_RUST_TOOLCHAIN: '1.99.1'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            desktop_bin: stagesync-desktop
            cli_bin: stagesync
            artifact: stagesync-linux-x86_64
          - name: macos-arm64
            os: macos-15
            desktop_bin: stagesync-desktop
            cli_bin: stagesync
            artifact: stagesync-macos-arm64
          - name: macos-x86_64
            os: macos-15-intel
            desktop_bin: stagesync-desktop
            cli_bin: stagesync
            artifact: stagesync-macos-x86_64
          - name: windows-x86_64
            os: windows-2022
            desktop_bin: stagesync-desktop.exe
            cli_bin: stagesync.exe
            artifact: stagesync-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Check Linux package checksums
        if: runner.os == 'Linux'
        run: bash packaging/linux/test_checksums.sh

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # eframe 0.37 (winit + wgpu) links against the system GL, X11, XCB,
          # XKB and Wayland client libraries, so their development headers have
          # to be present before `cargo build` runs. The audio output (cpal) links
          # against ALSA, so its development headers have to be there too. The
          # rest of the workspace has no system dependencies at all: symphonia
          # decodes in pure Rust.
          #
          # This is the well-known set for eframe/winit on Ubuntu 22.04 and
          # later. It cannot be verified from a Windows development machine -
          # it is exercised for the first time when this workflow runs.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.STAGESYNC_RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      # The compressed-format test needs ffmpeg. The test fails loudly rather
      # than quietly passing when ffmpeg is missing, so the tool has to be here
      # for the test to mean anything. The runner images carry ffmpeg; where
      # one does not, it is installed, and if it cannot be installed the job
      # says so rather than letting the test fail for the wrong reason.
      - name: Make sure ffmpeg is available
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          elif [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
            ffmpeg -version | head -n 1
          else
            echo "::error::ffmpeg is not installed on this runner, and the compressed-format test cannot run without it" >&2
            exit 1
          fi

      - name: Cache the cargo registry and the git checkouts
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-home-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-home-${{ runner.os }}-${{ matrix.name }}-

      - name: Cache the build directory
        uses: actions/cache@v4.3.0
        with:
          path: target
          key: target-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.name }}-

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the test suite
        run: cargo test --workspace

      - name: Build the release binaries
        run: cargo build --release --workspace

      - name: Upload the release binaries
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/${{ matrix.desktop_bin }}
            target/release/${{ matrix.cli_bin }}
          if-no-files-found: error
