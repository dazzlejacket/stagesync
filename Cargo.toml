[workspace]
resolver = "2"
members = [
    "crates/stagesync-core",
    "crates/stagesync-cli",
    "crates/stagesync-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stagesync/stagesync"
authors = ["StageSync contributors"]

[workspace.dependencies]
stagesync-core = { path = "crates/stagesync-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rustfft = "6"
hound = "3"
symphonia = { version = "0.6", features = ["aac", "isomp4", "wav", "pcm"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
